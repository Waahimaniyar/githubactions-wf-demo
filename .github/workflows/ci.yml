name: CI build&test
on:
   push:
     branches:
       - main
jobs:
  build:
     runs-on: ubuntu-22.04
     steps:
      - name: test phase
        run: echo "application build"
  test:
     runs-on: ubuntu-22.04
     needs: build
     steps:
       - name: test phase
         run: echo "my application test"
  deploy:
    runs-on: ubuntu-22.04
    needs: test
    steps:
     - name: deploy phase
       run: echo "deploy phase"
  image:
    runs-on: ubuntu-22.04
    needs: deploy
    steps:
     - name: image phase
       run: echo "image phase"
   
  
