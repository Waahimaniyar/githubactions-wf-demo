name: CI build&test
on:
   push:
     branches:
       - main
jobs:
  build:
     runs-on: ubuntu-22.04
     steps:
      - name: test phase
        run: echo "application build"
  test:
     runs-on: ubuntu-22.04
     needs: build
     steps:
       - name: test phase
         run: echo "my application test"
  deploy:
    runs-on: ubuntu-22.04
    needs: test
    steps:
     - name: deploy phase
       run: echo "deploy phase"
  image:
    runs-on: ubuntu-22.04
    needs: deploy
    steps:
     - name: image phase
       run: echo "image phase"
   
  container:
    runs-on: ubuntu-22.04
    needs: image
    steps:
     - name: container phase
       run: echo "container phase"
    
  k8s:
    runs-on: ubuntu-22.04
    needs: container
    steps:
     - name: k8s phase
       run: echo "k8s phase"
       
  github:
    runs-on: ubuntu-22.04
    needs: k8s
    steps:
     - name: github phase
       run: echo "github phase, ${{ secrets.docker_password }}"